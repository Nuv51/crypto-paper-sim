name: backtest-analysis
# Re-ejecuta de forma DETERMINISTA los dos backtests ya publicados (mismo código, mismos parámetros, mismas fechas) solo para volcar
# las tablas completas (equity, operaciones, precios) que el tablero resume. No cambia nada ni sustituye los resultados oficiales:
# el flujo verifica que el ROI de cada simulador coincida con el publicado y se niega a guardar si no coincide.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: backtest-analysis
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        period: ["2025", "2026"]
        sim: [actual, dinamico, indexado]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-ci.txt
      - name: Backtest ${{ matrix.period }} ${{ matrix.sim }} (con volcado)
        run: python -u backtest_run.py --period ${{ matrix.period }} --sim ${{ matrix.sim }} --out out/${{ matrix.period }}-${{ matrix.sim }} --export out/${{ matrix.period }}-${{ matrix.sim }}/tables
      - name: Verificar contra el resultado publicado
        run: |
          git fetch -q --depth 1 origin backtest-2025 backtest-2026
          python scripts/backtest_verify.py ${{ matrix.period }} ${{ matrix.sim }} out/${{ matrix.period }}-${{ matrix.sim }}/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: tables-${{ matrix.period }}-${{ matrix.sim }}
          path: |
            out/${{ matrix.period }}-${{ matrix.sim }}/tables
            out/${{ matrix.period }}-${{ matrix.sim }}/summary.json
  publish:
    needs: run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: res
      - name: Guardar en la rama backtest-data
        run: |
          mkdir pub && for d in res/tables-*; do n=${d#res/tables-}; mkdir -p pub/$n && cp -r $d/* pub/$n/; done
          cd pub
          git init -q -b backtest-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Backtest: tablas completas para análisis (corrida ${{ github.run_id }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" backtest-data
