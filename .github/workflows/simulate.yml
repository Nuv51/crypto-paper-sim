name: simulate

# Corre el simulador (dinero FICTICIO) en horario y guarda estado + tablero en la rama `sim-data`.
on:
  schedule:
    - cron: "17 */6 * * *"        # cada 6 horas (UTC), al minuto 17
  workflow_dispatch:
    inputs:
      source:
        description: "Fuente de datos: binance (real) o synthetic (inventados, solo pruebas)"
        default: "binance"
        type: choice
        options: [binance, synthetic]

permissions:
  contents: write

concurrency:
  group: simulate
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE: ${{ github.event.inputs.source || 'binance' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - run: pip install -r requirements-ci.txt

      - name: Traer la rama de datos (o crearla vacía)
        run: |
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$URL" sim-data >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch sim-data "$URL" store
          else
            mkdir store && git -C store init --quiet -b sim-data && git -C store remote add origin "$URL"
          fi

      - name: Simular un paso
        id: sim
        run: |
          set +e
          SUMMARY_FILE="$RUNNER_TEMP/summary.txt" STORE=store bash scripts/ci_run.sh
          echo "code=$?" >> "$GITHUB_OUTPUT"
          { echo "### Simulador (${SOURCE})"; echo; cat "$RUNNER_TEMP/summary.txt"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar estado y tablero en sim-data
        if: always()
        run: |
          cd store
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Sin cambios"; else
            git commit --quiet -m "simulador (${SOURCE}): $(head -c 120 "$RUNNER_TEMP/summary.txt")"
            git push --quiet origin sim-data
          fi

      - name: Aviso al celular (opcional, ntfy)
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "$NTFY_TOPIC" ] && [ -f "$RUNNER_TEMP/summary.txt" ]; then
            curl -fsS -H "Title: Simulador cripto (${SOURCE}) · dinero ficticio" \
                 -d "$(cat "$RUNNER_TEMP/summary.txt")" "https://ntfy.sh/${NTFY_TOPIC}" || true
          fi

      - name: Marcar fallo si el simulador no corrió
        if: steps.sim.outputs.code != '0'
        run: exit 1
