name: simulate

# Corre DOS simulaciones (dinero FICTICIO) cada hora y guarda estado + tablero de cada una en la rama `sim-data`:
#   · simulador ACTUAL   → carpeta binance/ (velas de 1 h, config.py)
#   · simulador DINÁMICO → carpeta activo/  (velas de 15 min, config_active.py)
# Los bots deciden al CIERRE de cada vela; si una corrida se retrasa o falla, la siguiente procesa todas las velas
# pendientes en orden, así que el resultado no depende de cuándo corre. Cada simulación falla por separado: si una
# no puede leer datos, la otra igual se guarda.
on:
  schedule:
    - cron: "7 * * * *"           # cada hora (UTC), al minuto 7 (las velas de 1 h ya cerraron)
  workflow_dispatch:
    inputs:
      source:
        description: "Fuente de datos: binance (mercado real) o synthetic (inventados, solo pruebas)"
        default: "binance"
        type: choice
        options: [binance, synthetic]
      reiniciar:
        description: "Reiniciar desde cero (necesario si cambias bots o parámetros de ESA simulación). Por defecto no reinicia ninguna"
        default: "ninguno"
        type: choice
        options: [ninguno, activo, actual]

permissions:
  contents: write
  actions: write

concurrency:
  group: simulate
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE: ${{ github.event.inputs.source || 'binance' }}
      REINICIAR: ${{ github.event.inputs.reiniciar || 'ninguno' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - run: pip install -r requirements-ci.txt

      - name: Traer la rama de datos (o crearla vacía)
        run: |
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$URL" sim-data >/dev/null 2>&1; then
            git clone --quiet --branch sim-data "$URL" store
          else
            mkdir store && git -C store init --quiet -b sim-data && git -C store remote add origin "$URL"
          fi

      - name: Simulador actual (velas de 1 h)
        id: sim
        run: |
          set +e
          FRESH=$([ "$REINICIAR" = "actual" ] && echo true || echo false)
          SUMMARY_FILE="$RUNNER_TEMP/summary.txt" NOTIFY_FILE="$RUNNER_TEMP/notify.txt" TABLE_FILE="$RUNNER_TEMP/table.md" \
            STORE=store SIM_DIR="$SOURCE" CONFIG=config FRESH="$FRESH" bash scripts/ci_run.sh
          echo "code=$?" >> "$GITHUB_OUTPUT"
          { echo "### Simulador actual (${SOURCE})"; echo; cat "$RUNNER_TEMP/summary.txt"; echo; cat "$RUNNER_TEMP/table.md";
            if [ -s "$RUNNER_TEMP/notify.txt" ]; then echo; echo '**Novedades**'; echo; echo '```'; cat "$RUNNER_TEMP/notify.txt"; echo '```'; fi; } >> "$GITHUB_STEP_SUMMARY"

      - name: Simulador dinámico (velas de 15 min)
        id: dyn
        run: |
          set +e
          FRESH=$([ "$REINICIAR" = "activo" ] && echo true || echo false)
          DIR=$([ "$SOURCE" = "binance" ] && echo activo || echo "activo-${SOURCE}")
          SUMMARY_FILE="$RUNNER_TEMP/summary_dyn.txt" NOTIFY_FILE="$RUNNER_TEMP/notify_dyn.txt" TABLE_FILE="$RUNNER_TEMP/table_dyn.md" \
            STORE=store SIM_DIR="$DIR" CONFIG=config_active FRESH="$FRESH" bash scripts/ci_run.sh
          echo "code=$?" >> "$GITHUB_OUTPUT"
          { echo "### Simulador dinámico (${SOURCE})"; echo; cat "$RUNNER_TEMP/summary_dyn.txt"; echo; cat "$RUNNER_TEMP/table_dyn.md";
            if [ -s "$RUNNER_TEMP/notify_dyn.txt" ]; then echo; echo '**Novedades**'; echo; echo '```'; cat "$RUNNER_TEMP/notify_dyn.txt"; echo '```'; fi; } >> "$GITHUB_STEP_SUMMARY"

      - name: Observatorio de spreads (solo mide; si falla, no afecta a los simuladores)
        id: obs
        if: env.SOURCE == 'binance'
        continue-on-error: true
        run: |
          set +e
          D=store/observatorio
          mkdir -p "$D/state" "$D/data" "$RUNNER_TEMP/obs"
          STATE_ARGS=()
          [ -f "$D/state/stats.json" ] && STATE_ARGS=(--state "$D/state/stats.json")
          python observatory_step.py "${STATE_ARGS[@]}" --out "$RUNNER_TEMP/obs" --snapshots 6 --interval 20
          CODE=$?
          [ -f "$RUNNER_TEMP/obs/status.json" ] && cp "$RUNNER_TEMP/obs/status.json" "$D/data/status.json"
          if [ "$CODE" -eq 0 ]; then
            cp "$RUNNER_TEMP/obs/stats.json" "$D/state/stats.json"
            cp "$RUNNER_TEMP/obs/summary.json" "$D/data/summary.json"
            cp web/observatorio.html "$D/index.html"
            { echo "### Observatorio de spreads"; echo; cat "$RUNNER_TEMP/obs/summary.md"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Observatorio sin datos nuevos (código $CODE): $(head -c 300 "$RUNNER_TEMP/obs/status.json" 2>/dev/null)"
          fi
          exit 0

      - name: Guardar estado y tablero en sim-data
        if: always()
        run: |
          cd store
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Sin cambios"; else
            git commit --quiet -m "simulador (${SOURCE}): $(head -c 120 "$RUNNER_TEMP/summary.txt")"
            # el historial de git de esta rama no hace falta (el estado completo va en ledger.json): se compacta
            # cada ~150 commits para que el repositorio no crezca sin límite (hay dos estados por commit)
            if [ "$(git rev-list --count HEAD)" -gt 150 ]; then
              git checkout --quiet --orphan compact
              git commit --quiet -m "simulador: historial compactado"
              git branch -M sim-data
              git push --quiet --force origin sim-data
            else
              git push --quiet origin sim-data
            fi
          fi

      - name: Aviso al celular (ntfy) · operaciones nuevas o falla
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CODE: ${{ steps.sim.outputs.code }}
          CODE_DYN: ${{ steps.dyn.outputs.code }}
        run: |
          [ -z "$NTFY_TOPIC" ] && exit 0
          PAGES="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/${SOURCE}/"
          # el dinámico opera mucho: solo avisa si FALLA (sus operaciones se ven en su tablero y en el resumen del job)
          if [ "$CODE_DYN" != "0" ]; then
            curl -fsS -H "Title: Simulador dinámico - FALLO" -H "Priority: high" -H "Tags: warning" \
                 -d "$(cat "$RUNNER_TEMP/summary_dyn.txt")" "https://ntfy.sh/${NTFY_TOPIC}" || true
          fi
          if [ "$CODE" != "0" ]; then
            curl -fsS -H "Title: Simulador cripto - FALLO" -H "Priority: high" -H "Tags: warning" \
                 -d "$(cat "$RUNNER_TEMP/summary.txt")" "https://ntfy.sh/${NTFY_TOPIC}" || true
          elif [ -s "$RUNNER_TEMP/notify.txt" ]; then
            curl -fsS -H "Title: Simulador cripto - operaciones (dinero ficticio)" -H "Tags: chart_with_upwards_trend" \
                 -H "Click: ${PAGES}" -d "$(cat "$RUNNER_TEMP/notify.txt")" "https://ntfy.sh/${NTFY_TOPIC}" || true
          fi

      - name: Mantener activo el flujo programado (mejor esfuerzo)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/simulate.yml/enable" || true

      - name: Marcar fallo si algún simulador no corrió
        if: steps.sim.outputs.code != '0' || steps.dyn.outputs.code != '0'
        run: exit 1
