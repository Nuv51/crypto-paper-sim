name: v2-inputs
# Entradas del backtest V2 2019-2024 (solo lectura): capitalizaciones de CoinMarketCap al inicio de cada año y
# sondeo punto-en-el-tiempo de Binance spot para sus candidatas. Guarda todo en la rama `v2-inputs`.
on:
  workflow_dispatch:
    inputs:
      paso:
        description: "caps = solo capitalizaciones · pit = además el sondeo de Binance (usa las caps ya guardadas)"
        type: choice
        default: caps
        options: [caps, pit, debug]
      fechas:
        description: "Fechas de las fotos de CoinMarketCap (solo paso caps), separadas por coma"
        type: string
        default: "2018-12-30,2019-12-29,2020-12-27,2021-12-26,2022-12-25,2023-12-31"
      anios:
        description: "Años del sondeo de Binance (solo paso pit), separados por coma"
        type: string
        default: "2019,2020,2021,2022,2023,2024"
permissions:
  contents: write
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests pandas
      - name: Capitalizaciones (foto de CoinMarketCap ≤ 1 de enero de cada año)
        if: ${{ inputs.paso == 'caps' }}
        run: |
          mkdir -p out
          python3 scripts/fetch_caps_cmc.py --dates ${{ inputs.fechas }} --out out 2>&1 | tee out/log.txt
          exit ${PIPESTATUS[0]}
      - name: Depuración de la estructura de la página de CoinMarketCap
        if: ${{ inputs.paso == 'debug' }}
        run: |
          mkdir -p out
          python3 scripts/debug_cmc.py 2>&1 | tee out/log.txt
      - name: Sondeo de Binance punto-en-el-tiempo (usa backtest_v2/inputs/caps_cmc_*.json del repositorio)
        if: ${{ inputs.paso == 'pit' }}
        run: |
          mkdir -p out
          python3 scripts/pit_v2.py --years ${{ inputs.anios }} --inputs backtest_v2/inputs --out out 2>&1 | tee out/log.txt
          exit ${PIPESTATUS[0]}
      - name: Guardar en la rama v2-inputs
        if: always()
        run: |
          mkdir -p out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan v2-inputs
          git rm -rf --quiet . || true
          git add -f out
          git commit -q -m "v2-inputs: ${{ inputs.paso }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" v2-inputs
