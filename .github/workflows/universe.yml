name: universe
# Sondeo manual (solo lectura): ¿qué monedas candidatas operan en Binance spot, con cuánta historia y liquidez?
# Guarda el resultado en la rama `universe`. Lo usa el simulador indexado para fijar su universo.
on:
  workflow_dispatch:
    inputs:
      candidates:
        description: "Monedas candidatas separadas por coma (sin USDT)"
        required: true
        type: string
      modo:
        description: "actual = estado de hoy en Binance · pit2025 = datos para armar el universo del 2025-01-01"
        default: "actual"
        type: choice
        options: [actual, pit2025]
      asof:
        description: "(solo pit2025) inicio del periodo YYYY-MM-DD"
        default: "2025-01-01"
        type: string
      end:
        description: "(solo pit2025) fin del periodo, exclusivo YYYY-MM-DD"
        default: "2026-01-01"
        type: string
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - name: Sondeo
        run: |
          if [ "${{ inputs.modo }}" = "pit2025" ]; then
            python3 scripts/universe_2025.py --candidates "${{ inputs.candidates }}" --asof "${{ inputs.asof }}" --end "${{ inputs.end }}" --out universe_check.json
          else
            python3 scripts/universe_check.py --candidates "${{ inputs.candidates }}" --out universe_check.json
          fi
      - name: Guardar resultado en la rama universe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan universe
          git rm -rf --quiet . || true
          git add -f universe_check.json
          git commit -q -m "universe: resultado del sondeo"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" universe
