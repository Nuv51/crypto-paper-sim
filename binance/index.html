<title>Simulador de bots cripto</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Concepto: tablero de control sobrio. Resumen primero, detalle después; el estado se codifica con forma + texto, no solo con color. */
:root {
  --bg: #f1f3f5; --surface: #fdfdfe; --surface2: #f6f7f9; --line: #dfe3e8;
  --ink: #0f1419; --ink2: #4a5260; --muted: #6b7380; --grid: rgba(74,82,96,.16);
  --accent: #2a78d6; --accent-ink: #ffffff;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b;
  --div-blue: #2a78d6; --div-red: #e34948; --div-mid: #f0efec;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --cash: #cdd2d9; --other: #8f97a3;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101214; --surface: #181b1e; --surface2: #1f2327; --line: #2a2f35;
    --ink: #eceef1; --ink2: #b9bfc8; --muted: #8f97a3; --grid: rgba(185,191,200,.16);
    --accent: #3987e5; --accent-ink: #0b0d10;
    --div-blue: #3987e5; --div-red: #e66767; --div-mid: #383835;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --cash: #3a4048; --other: #6b7380;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101214; --surface: #181b1e; --surface2: #1f2327; --line: #2a2f35;
  --ink: #eceef1; --ink2: #b9bfc8; --muted: #8f97a3; --grid: rgba(185,191,200,.16);
  --accent: #3987e5; --accent-ink: #0b0d10;
  --div-blue: #3987e5; --div-red: #e66767; --div-mid: #383835;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --cash: #3a4048; --other: #6b7380;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45;
  padding-block: 0 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1180px; margin: 0 auto; }
h1, h2, h3, p { margin: 0; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding-block: 18px 12px; }
.top h1 { font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.top .sub { color: var(--ink2); font-size: 12.5px; min-width: 0; }
.topr { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; }
a.stamp { text-decoration: none; color: var(--accent); border-color: var(--accent); }
.stamp { display: inline-flex; align-items: center; gap: 8px; font: 500 11.5px var(--font); letter-spacing: .06em; text-transform: uppercase;
  padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink2); }
.simnav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-top: 14px; }
.simnav:empty { display: none; }
.simnav .lbl { font: 500 11px var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.simnav a { font: 500 13px var(--font); text-decoration: none; color: var(--ink2); padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); white-space: nowrap; }
.simnav a:hover { border-color: var(--accent); color: var(--ink); }
.simnav a[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); cursor: default; }
@media (max-width: 560px) { .simnav { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: thin; } .simnav .lbl { display: none; } }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; font-size: 13px;
  background: var(--surface); border: 1px solid var(--line); border-left-width: 4px; min-width: 0; }
.banner b { font-weight: 600; }
.banner.warn { border-left-color: var(--warn); }
.banner.crit { border-left-color: var(--crit); }
.banner.info { border-left-color: var(--accent); }
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 16px; scrollbar-width: thin; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; }
.tabs button { font: 500 13px var(--font); color: var(--ink2); background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px; white-space: nowrap; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.panel { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
h2 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
.hint { color: var(--muted); font-size: 12.5px; max-width: 78ch; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.kpi .l { font-size: 11.5px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.kpi .v { font: 500 19px var(--mono); margin-top: 4px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi .d { font: 400 12px var(--mono); color: var(--ink2); margin-top: 2px; font-variant-numeric: tabular-nums; }
.tri { font-size: 10px; margin-right: 4px; vertical-align: 1px; }
.tri.up { color: var(--good); } .tri.down { color: var(--crit); } .tri.flat { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 6px; }
.legend button { display: inline-flex; align-items: center; gap: 6px; font: 400 12.5px var(--font); color: var(--ink2); background: none; border: 0; padding: 4px 0; cursor: pointer; }
.legend button[aria-pressed="false"] { opacity: .4; text-decoration: line-through; }
.legend i { width: 14px; height: 0; border-top: 3px solid; display: inline-block; }
.legend i.dash { border-top-style: dashed; border-top-width: 2px; }
.legend i.sq { height: 10px; width: 10px; border: 0; border-radius: 2px; }
.chart { position: relative; min-width: 0; touch-action: pan-y; }
.chart svg { display: block; max-width: 100%; overflow: visible; }
.chart .ax text { fill: var(--ink2); font: 11px var(--mono); }
.chart .gridl { stroke: var(--grid); stroke-width: 1; }
.chart .zero { stroke: var(--ink2); stroke-width: 1; opacity: .5; }
.chart .xh { stroke: var(--ink2); stroke-width: 1; stroke-dasharray: 3 3; }
.tip { position: absolute; top: 6px; z-index: 3; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.14); min-width: 140px; max-width: 260px; }
.tip .t { color: var(--muted); font: 400 11px var(--mono); margin-bottom: 4px; }
.tip .r { display: flex; justify-content: space-between; gap: 12px; }
.tip .r b { font: 500 12px var(--mono); font-variant-numeric: tabular-nums; }
.tip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 6px; }
.bots { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 12px; }
.bot { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.bot header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bot h3 { font-size: 14.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; min-width: 0; }
.sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.cmp th .sw { display: inline-block; margin-right: 5px; vertical-align: baseline; }
.bot .strat { color: var(--ink2); font-size: 12.5px; }
.bot .meta { color: var(--muted); font-size: 12px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px 10px; margin: 2px 0 0; }
.stats div { min-width: 0; }
.stats dt { overflow-wrap: anywhere; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.stats dd { margin: 0; font: 500 12.5px var(--mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 500 11.5px var(--font); padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface2); color: var(--ink); white-space: nowrap; }
.pill i { display: inline-block; width: 8px; height: 8px; }
.st-active i { background: var(--good); border-radius: 50%; }
.st-paused i { border-left: 3px solid var(--warn); border-right: 3px solid var(--warn); width: 9px; height: 9px; }
.st-halted i { background: var(--crit); }
.st-retired i { border: 2px solid var(--crit); width: 9px; height: 9px; box-sizing: border-box; border-radius: 2px; }
/* medidor de cercanía al límite de drawdown: la marca vertical está en el 80 %, donde empieza el aviso */
.rk { position: relative; height: 6px; border-radius: 3px; background: var(--line); }
.rk i { display: block; height: 100%; border-radius: 3px; background: var(--good); }
.rk.watch i { background: var(--warn); } .rk.near i { background: var(--crit); }
.rk::after { content: ''; position: absolute; left: 80%; top: -3px; bottom: -3px; width: 1px; background: var(--ink2); opacity: .55; }
.rkc { display: flex; flex-direction: column; gap: 5px; min-width: 150px; }
.rkt { font: 400 11.5px var(--mono); color: var(--ink2); font-variant-numeric: tabular-nums; }
.rkt b { font-weight: 600; }
.fg-top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
.fg-v { font: 600 34px/1 var(--font); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.fg-l { font: 500 14px var(--font); color: var(--ink2); }
.fg-bar { position: relative; height: 10px; border-radius: 5px; margin: 0 2px;
  background: linear-gradient(90deg, var(--div-red) 0%, color-mix(in srgb, var(--div-red) 35%, var(--div-mid)) 30%, var(--div-mid) 50%, color-mix(in srgb, var(--div-blue) 35%, var(--div-mid)) 70%, var(--div-blue) 100%); }
.fg-bar i { position: absolute; top: -5px; width: 5px; height: 20px; border-radius: 3px; background: var(--ink); border: 2px solid var(--surface); transform: translateX(-50%); box-sizing: border-box; }
.fg-sc { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 11px; color: var(--muted); }
.fg-h { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 14px 0 0; padding: 0; list-style: none; font: 400 12px var(--mono); color: var(--ink2); }
.fg-h b { font-weight: 600; color: var(--ink); }
.verdict { margin: 0 0 12px; font-size: 13px; color: var(--ink2); line-height: 1.45; }
.verdict b { color: var(--ink); }
.reason { font-size: 12px; color: var(--ink2); background: var(--surface2); border-radius: 6px; padding: 6px 8px; }
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 500; background: var(--surface2); }
td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
td.wrap { white-space: normal; min-width: 200px; }
@media (max-width: 560px) { .cmp th, .cmp td { padding: 6px 5px; white-space: normal; } .cmp th { font-size: 9.5px; letter-spacing: 0; } .cmp td:first-child { max-width: 112px; } .cmp td.n small { white-space: nowrap; } }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filters label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; min-width: 0; }
select, .btn { font: 400 13px var(--font); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-width: 130px; max-width: 100%; }
.btn { cursor: pointer; min-width: 0; }
.btn:hover { background: var(--surface2); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: 400 13px var(--font); background: var(--surface); color: var(--ink2); border: 0; padding: 7px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.heat { border-collapse: separate; border-spacing: 3px; width: auto; }
.heat th { background: none; text-transform: none; letter-spacing: 0; font-size: 11.5px; color: var(--ink2); white-space: normal; max-width: 92px; vertical-align: bottom; padding: 2px 4px; }
.heat td { text-align: center; font: 500 12px var(--mono); border-radius: 4px; padding: 10px 8px; min-width: 52px; border: 0; color: var(--ink); }
.pillish { display: inline-block; padding: 2px 8px; border-radius: 4px; background: var(--surface2); border: 1px solid var(--line); font-size: 12px; }
.empty { text-align: center; padding: 48px 16px; color: var(--ink2); }
.empty h2 { font-size: 17px; margin-bottom: 6px; color: var(--ink); }
details { background: var(--surface2); border-radius: 6px; padding: 6px 10px; font-size: 12px; }
details pre { margin: 6px 0 2px; font: 400 11.5px var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink2); }
.docgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
.doc dl { display: grid; grid-template-columns: 112px 1fr; gap: 6px 10px; margin: 0; font-size: 12.5px; }
.doc dt { color: var(--muted); } .doc dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.ev { display: flex; flex-direction: column; }
.ev div { display: grid; grid-template-columns: 112px 60px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.ev div:last-child { border-bottom: 0; }
.ev .when { font: 400 11.5px var(--mono); color: var(--muted); }
@media (max-width: 560px) { .ev div { grid-template-columns: 1fr; gap: 2px; } }
/* ---- pestaña Summary: minimalista, una idea por tarjeta */
.sm { display: flex; flex-direction: column; gap: 14px; }
.sm-hero { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 6px 24px; padding: 4px 2px 0; }
.sm-hero .l { font-size: 11.5px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
.sm-hero .big { font: 600 clamp(30px, 8vw, 40px)/1.05 var(--font); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.sm-hero .big small { font: 500 14px var(--font); color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.sm-hero .d { font: 500 13px var(--mono); color: var(--ink2); font-variant-numeric: tabular-nums; line-height: 1.5; }
.sm-hero .d small { display: block; font: 400 11.5px var(--font); color: var(--muted); }
.sm-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; }
.sm-tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.sm-tile .l { font-size: 11px; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.sm-tile .v { font: 500 17px var(--mono); margin-top: 3px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.sm-tile .d { font: 400 11.5px var(--font); color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
.meter { height: 4px; border-radius: 2px; background: var(--line); margin-top: 8px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.sm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 12px; }
.sm-card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; }
.sm-card > h2 { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; font: 500 11.5px var(--font); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin: 0 0 12px; }
.sm-card > h2 .r { text-transform: none; letter-spacing: 0; font: 400 12px var(--mono); color: var(--ink2); }
.sm-card .seg button { padding: 4px 9px; font-size: 12px; }
.dn { position: relative; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 14px 20px; }
.dn svg { flex: none; width: 168px; height: 168px; max-width: 100%; }
.dn .slice { fill: none; transition: opacity .12s; }
.dn svg:has(.slice:hover) .slice:not(:hover) { opacity: .4; }
.dn .ctr { fill: var(--ink); text-anchor: middle; }
.dn .tip { top: 0; }
.lg { list-style: none; margin: 0; padding: 0; flex: 1 1 180px; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.lg li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto auto; gap: 4px 8px; align-items: center; font-size: 12.5px; }
.lg .nm { color: var(--ink2); overflow-wrap: anywhere; line-height: 1.25; }
.lg .pc { font: 500 12px var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
.lg .vl { font: 400 11.5px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; min-width: 48px; }
.sm-grid.three { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.sm-ctrl { margin-bottom: 8px; max-width: 100%; overflow-x: auto; }
.sm-ctrl .seg button { padding: 5px 10px; white-space: nowrap; }
.sm-ctrl .seg button:disabled { opacity: .4; cursor: not-allowed; }
.cmp { font-size: 12.5px; } .cmp th, .cmp td { padding: 6px 10px; }
@media (max-width: 560px) { .cmp { font-size: 12px; } .cmp th, .cmp td { padding: 6px 6px; } .cmp th { font-size: 10px; letter-spacing: 0; } }
.cmp td.best { font-weight: 600; color: var(--ink); } .cmp td.best::before { content: '▲ '; color: var(--good); font-size: 10px; }
.cmp td.n.best::before { content: '▲\00a0'; }
.cmp-win { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 4px; }
.cmp-win .chip { font: 500 12px var(--font); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; background: var(--surface); color: var(--ink2); }
.cmp-win .chip b { color: var(--ink); }
.cmp tr.cur td { background: var(--surface2); font-weight: 600; }
.fam { display: flex; flex-direction: column; gap: 10px; }
.fam-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.fam-h h2 { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 15px; }
.fam-s { font: 400 12px var(--mono); color: var(--ink2); }
.hb { display: flex; flex-direction: column; gap: 4px; }
.hb-r { display: grid; grid-template-columns: minmax(92px, 36%) minmax(60px, 1fr) minmax(74px, auto); gap: 10px; align-items: center; min-height: 32px; font-size: 12.5px; }
.hb-n { color: var(--ink2); min-width: 0; overflow-wrap: anywhere; line-height: 1.25; }
.hb-n small { display: block; font-size: 11px; color: var(--muted); }
.hb-t { position: relative; height: 10px; }
.hb-t::before { content: ''; position: absolute; left: 50%; top: -6px; bottom: -6px; width: 1px; background: var(--ink2); opacity: .35; }
.hb-b { position: absolute; top: 0; height: 100%; }
.hb-b.pos { left: 50%; background: var(--div-blue); border-radius: 0 4px 4px 0; }
.hb-b.neg { right: 50%; background: var(--div-red); border-radius: 4px 0 0 4px; }
.hb-b.zero { left: calc(50% - 1px); width: 2px; background: var(--muted); }
.hb-v { text-align: right; font: 500 12px var(--mono); font-variant-numeric: tabular-nums; line-height: 1.25; }
.hb-v small { display: block; font: 400 10.5px var(--mono); color: var(--muted); }
@media (max-width: 560px) {      /* en móvil: nombre y valor arriba, la barra completa debajo */
  .hb { gap: 6px; }
  .hb-r { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "n v" "t t"; gap: 5px 10px; min-height: 0; }
  .hb-n { grid-area: n; } .hb-v { grid-area: v; } .hb-t { grid-area: t; height: 8px; }
}
@media (prefers-reduced-motion: no-preference) { .tabs button { transition: color .12s; } }
</style>

<div class="wrap" id="app">

    var headI = '<tr><th></th>' + inc.map(function (x) { return '<th class="n"><span class="sw" style="background:' + x.color + '"></span>' + esc(x.name) + '</th>'; }).join('') + '</tr>';
    var mx = Math.max.apply(null, wins), lead = wins.map(function (v, i) { return v === mx ? i : -1; }).filter(function (i) { return i >= 0; });
    var chips = inc.map(function (x, i) { return '<span class="chip"><span class="sw" style="background:' + x.color + '"></span> <b>' + esc(x.name) + '</b> · ' + wins[i] + ' de ' + scored + '</span>'; }).join('');
    var verdictW = mx === 0 ? 'Ninguno se despega todavía.' : lead.length > 1 ? 'Empate en métricas ganadas: ' + lead.map(function (i) { return '<b>' + esc(inc[i].name) + '</b>'; }).join(' y ') + '.' : '<b>' + esc(inc[lead[0]].name) + '</b> gana más métricas (' + mx + ' de ' + scored + ').';
    var short = span < 30 * DAY_MS;
    out += '<section class="sm-card"><h2>¿Quién rinde mejor? <span class="r">' + esc(per[2] < 0 ? 'periodo en común' : per[1]) + ' · ' + nf(span / DAY_MS, 1) + ' días</span></h2>' +
      '<p class="verdict">' + verdictW + (short ? ' <b>Con menos de 30 días de datos esto es ruido, no un veredicto</b> (la regla del proyecto: no juzgar con menos de ~30 días).' : '') + '</p><div class="cmp-win">' + chips + '</div>' +
      '<div class="tw cmp"><table><thead>' + headI + '</thead><tbody>' + rowsH + '</tbody></table></div>' +
      '<p class="hint" style="margin-top:6px">▲ = mejor en esa fila. Se cuentan 4 métricas (ROI, caída máxima, retorno por unidad de caída y comisiones por día); “contra Bitcoin” se muestra pero no cuenta, porque ordena igual que el ROI. Retorno por unidad de caída = ROI ÷ caída máxima del periodo (— si no hubo caída). Las comisiones son de toda la vida del simulador, por día, para no castigar al más viejo.</p></section>';
  } else if (ok) {
    out += '<section class="sm-card"><h2>¿Quién rinde mejor?</h2><p class="hint">Para este periodo solo un simulador tiene historial suficiente, así que no hay con quién compararlo. Elige otro periodo.</p></section>';
  }

  /* ---- ROI por periodo (cada simulador con su propio historial; — si aún no lleva ese tiempo) */
  var FP = CMP_PERIODS.filter(function (p) { return p[2] > 0; }).map(function (p) { return [p[0], p[1], p[2]]; }).concat([['all', 'Desde el inicio de cada uno', 0]]);
  var BM = (L.filter(function (x) { return x.d.benchmarks && x.d.benchmarks.BTCUSDT; })[0] || {}).d;
  var rowsR = FP.map(function (p) {
    var v = L.map(function (x) { return portRet(x.d, p); }), bi = bestIdx(v, true);
    var btc = BM ? benchRet(BM.benchmarks, 'BTCUSDT', p, BM.kpis) : (p[2] ? null : (L[0].d.kpis.btc_ret));
    return '<tr><td>' + esc(p[1]) + '</td>' + v.map(function (x, i) { return fin(x) ? '<td class="n' + (i === bi ? ' best' : '') + '">' + sgn(x, 2, '%') + '</td>' : '<td class="n" title="Aún no lleva ese tiempo corriendo">—</td>'; }).join('') +
      (fin(btc) ? '<td class="n">' + sgn(btc, 2, '%') + '</td>' : '<td class="n" title="Sin historial de mercado para ese periodo">—</td>') + '</tr>';
  }).join('');
  out += '<div><h2>ROI por periodo</h2><div class="tw cmp"><table><thead><tr><th>Periodo (hasta hoy)</th>' + L.map(function (x) { return '<th class="n"><span class="sw" style="background:' + x.color + '"></span>' + esc(x.name) + '</th>'; }).join('') + '<th class="n">Bitcoin</th></tr></thead><tbody>' + rowsR + '</tbody></table></div>' +
    '<p class="hint" style="margin-top:6px">▲ = mejor ROI en el periodo. <b>—</b> = el simulador aún no lleva ese tiempo corriendo; no se inventa historial. La última fila es el ROI acumulado de cada uno desde que arrancó (no es el mismo periodo: el más viejo tiene más días). Bitcoin: comprar y mantener, sin comisiones (el historial de mercado de los tableros cubre hasta ~1 año).</p></div>';

  /* ---- máximos y mínimos históricos */
  var HL = L.map(function (x) { return hiLo(x.d); });
  var hcell = function (f) { return '<tr><td>' + esc(f[0]) + '</td>' + L.map(function (x, i) { return '<td class="n">' + f[1](x.d, x.d.kpis, HL[i]) + '</td>'; }).join('') + '</tr>'; };
  var capOf = function (K) { return K.capital || 1; };
  out += '<div><h2>Máximos y mínimos históricos <span class="r" style="font-weight:400">desde que arrancó cada simulador</span></h2><div class="tw cmp"><table><thead>' + head + '</thead><tbody>' +
    [['Máximo histórico (ATH), USDT', function (d, K, h) { return nf(h.hi, 2) + '<small style="display:block;color:var(--muted)">' + esc(fmtDT(h.hiTs)) + '</small>'; }],
     ['ROI en el máximo', function (d, K, h) { return sgn((h.hi / capOf(K) - 1) * 100, 2, '%'); }],
     ['Mínimo histórico (ATL), USDT', function (d, K, h) { return nf(h.lo, 2) + '<small style="display:block;color:var(--muted)">' + esc(fmtDT(h.loTs)) + '</small>'; }],
     ['ROI en el mínimo', function (d, K, h) { return sgn((h.lo / capOf(K) - 1) * 100, 2, '%'); }],
     ['Equity actual, USDT', function (d, K) { return nf(K.equity, 2); }],
     ['Distancia al máximo', function (d, K, h) { return sgn((K.equity / h.hi - 1) * 100, 2, '%'); }],
     ['Distancia al mínimo', function (d, K, h) { return sgn((K.equity / h.lo - 1) * 100, 2, '%'); }],
     ['Caída máxima (peak a valle)', function (d, K) { return nf(K.max_dd, 2) + '%'; }]].map(hcell).join('') +
    '</tbody></table></div><p class="hint" style="margin-top:6px">Máximo y mínimo del equity del portafolio (incluye el efectivo) medidos sobre todas las velas del simulador, no solo sobre las gráficas. ROI = frente al capital inicial de cada uno. Son cifras de una prueba corta: un máximo de hace unos días no es un “récord” en ningún sentido estadístico.</p></div>';
  var anyMarket = L.every(function (x) { return fin(x.d.kpis.market_pnl); });
  out += '<div><h2>Cifras acumuladas de cada uno</h2><div class="tw cmp"><table><thead>' + head + '</thead><tbody>' +
    row('Velas', function (d) { return esc(d.interval); }) +
    row('Bots', function (d) { return d.bots.length; }) +
    row('Corriendo desde', function (d, K) { return esc(dayf.format(new Date(K.first_ts))); }) +
    row('Días de prueba', function (d, K) { return nf(days(K), 1); }) +
    row('Capital (USDT)', function (d, K) { return nf(K.capital, 0); }) +
    row('Equity (USDT)', function (d, K) { return nf(K.equity, 2); }) +
    row('P&L (USDT)', function (d, K) { return sgn(K.pnl, 2); }) +
    row('ROI', function (d, K) { return sgn(K.roi, 2, '%'); }) +
    (anyMarket ? row('Por el mercado (USDT)', function (d, K) { return sgn(K.market_pnl, 2); }) + row('Por los bots (USDT)', function (d, K) { return sgn(K.own_pnl, 2); }) : '') +
    row('Comisiones (USDT)', function (d, K) { return nf(K.fees, 2); }) +
    row('Operaciones', function (d, K) { return K.n_trades; }) +
    row('Operaciones por día', function (d, K) { return nf(K.n_trades / days(K), 1); }) +
    row('Máx. drawdown', function (d, K) { return nf(K.max_dd, 2) + '%'; }) +
    row('Ganancia / pérdida histórica', function (d, K) { return nf(K.gross_profit, 0) + ' / ' + nf(K.gross_loss, 0); }) +
    row('Bots activos / pausados / retirados', function (d) { return countStatus(d, 'active') + ' / ' + countStatus(d, 'paused') + ' / ' + countStatus(d, 'retired'); }) +
    '</tbody></table></div></div>';
  var fams = L.map(function (x) { var m = {}; (x.d.families || []).forEach(function (f) { m[f.key] = f; }); return m; }), keys = [], names = {};
  L.forEach(function (x) { (x.d.families || []).forEach(function (f) { if (keys.indexOf(f.key) < 0) { keys.push(f.key); names[f.key] = f.name; } }); });
  var cell = function (f) { return f ? sgn(f.pnl, 2) + '<small style="display:block;color:var(--muted)">' + f.bots.length + ' bots · ' + f.n_trades + ' ops</small>' : '—'; };
  out += '<div><h2>Por estrategia (P&amp;L en USDT)</h2><div class="tw cmp"><table><thead><tr><th>Estrategia</th>' + L.map(function (x) { return '<th class="n"><span class="sw" style="background:' + x.color + '"></span>' + esc(x.name) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    keys.map(function (k) { return '<tr><td>' + esc(names[k]) + '</td>' + fams.map(function (m) { return '<td class="n">' + cell(m[k]) + '</td>'; }).join('') + '</tr>'; }).join('') +
    '</tbody></table></div><p class="hint" style="margin-top:6px">El P&amp;L de cada estrategia incluye el efecto del mercado sobre lo que mantiene. Simuladores con distinto número de bots o de capital por estrategia no son comparables en USDT: usa el ROI de cada pestaña Rendimiento si necesitas igualar tamaños.</p></div>';
  return out;
}
function buildPanels(d, status, st, w) {
  return { summary: panelSummary(d, st, w), resumen: panelResumen(d, st, w), pnl: panelPnl(d, st, w), tx: panelTx(d, st, w), riesgo: panelRiesgo(d, st, w), tendencias: panelTend(d, st, w), bots: panelBots(d), comparar: panelComparar(d, st, w) };
}
function bannersHtml(d, status) {
  var s = '';
  if (d && d.synthetic) s += '<div class="banner crit"><span><b>DATOS INVENTADOS.</b> ' + esc(d.source) + '. Esto solo prueba el sistema; no representa ningún mercado real.</span></div>';
  else if (d) s += '<div class="banner info"><span><b>Simulación con dinero ficticio.</b> Precios reales de ' + esc(d.source) + '. Los resultados simulados no garantizan resultados futuros.</span></div>';
  if (status && status.ok === false) s += '<div class="banner warn"><span><b>La última corrida no actualizó el tablero</b> (' + esc(fmtDT(status.ts)) + '): ' + esc(status.message) + ' Se conserva el estado anterior.</span></div>';
  return s;
}
function subHtml(d, status) {
  if (!d) return status && status.ok === false ? 'Sin datos todavía.' : 'Sin datos todavía.';
  return 'Periodo ' + esc(fmtDT(d.kpis.first_ts)) + ' → ' + esc(fmtDT(d.kpis.last_ts)) + ' · velas de ' + esc(d.interval) + ' · actualizado ' + esc(fmtDT(d.generated_at)) + ' (' + ago(d.generated_at) + ')';
}
function emptyHtml(status) {
  return '<div class="empty"><h2>Aún no hay datos</h2><p>' + (status && status.ok === false ? 'La primera corrida no pudo completarse: ' + esc(status.message) : 'La primera corrida programada publicará aquí el tablero.') + '</p></div>';
}

var api = { simNavHtml: simNavHtml, buildPanels: buildPanels, bannersHtml: bannersHtml, subHtml: subHtml, emptyHtml: emptyHtml, REG: REG, niceTicks: niceTicks, lineChart: lineChart, barChart: barChart, coneChart: coneChart };
if (TEST) { globalThis.__dashApi = api; return; }

/* ------------------------------------------------------------------ DOM */
var $ = function (s, r) { return (r || document).querySelector(s); };
var state = { tab: 'summary', smCash: false, smPer: 'all', hidden: {}, tx: { bot: '', ex: '', sym: '', side: '' }, txLimit: 100, sym: '', hz: '24', others: [], selfOrder: null, cmpPer: 'common' };
var D = null, S = null, pending = null;

function width() { var p = $('#panel'); return Math.max(280, (p && p.clientWidth) || 640) - 2; }
function wire() {
  var panel = $('#panel');
  panel.querySelectorAll('.legend button[data-key]').forEach(function (b) { b.addEventListener('click', function () { state.hidden[b.dataset.key] = !state.hidden[b.dataset.key]; render(); }); });
  panel.querySelectorAll('.chart').forEach(function (el) {
    var g = REG[el.dataset.chart]; if (!g) return;
    var svg = el.querySelector('svg'), tip = el.querySelector('.tip'), xh = el.querySelector('.xh');
    function hide() { tip.hidden = true; xh.style.display = 'none'; }
    function move(e) {
      var r = svg.getBoundingClientRect(); if (!r.width) return;
      var i = nearest(g.xpx, (e.clientX - r.left) * (g.w / r.width)), html = g.tip(i); if (!html) { hide(); return; }
      xh.setAttribute('x1', g.xpx[i]); xh.setAttribute('x2', g.xpx[i]); xh.style.display = '';
      tip.innerHTML = html; tip.hidden = false;
      var left = g.xpx[i] * (r.width / g.w), tw = tip.offsetWidth, tx = left + 12;
      if (tx + tw > r.width) tx = left - tw - 12;
      tip.style.left = Math.max(0, tx) + 'px';
    }
    el.addEventListener('pointermove', move); el.addEventListener('pointerdown', move); el.addEventListener('pointerleave', hide);
  });
  panel.querySelectorAll('.dn').forEach(function (box) {          /* hover/toque en las dos donas */
    var tip = box.querySelector('.tip');
    box.querySelectorAll('[data-tip]').forEach(function (el) {
      function show(e) {
        var r = box.getBoundingClientRect(); tip.innerHTML = el.getAttribute('data-tip'); tip.hidden = false;
        var x = e.clientX - r.left + 12, y = e.clientY - r.top + 12;
        if (x + tip.offsetWidth > r.width) x = e.clientX - r.left - tip.offsetWidth - 12;
        tip.style.left = Math.max(0, x) + 'px'; tip.style.top = Math.max(0, y) + 'px';
      }
      el.addEventListener('pointermove', show); el.addEventListener('pointerdown', show); el.addEventListener('pointerleave', function () { tip.hidden = true; });
    });
  });
  panel.querySelectorAll('[data-cmpper]').forEach(function (b) { b.addEventListener('click', function () { if (b.disabled) return; state.cmpPer = b.dataset.cmpper; render(); }); });
  panel.querySelectorAll('[data-smper]').forEach(function (b) { b.addEventListener('click', function () { state.smPer = b.dataset.smper; render(); }); });
  panel.querySelectorAll('[data-smcash]').forEach(function (b) { b.addEventListener('click', function () { state.smCash = b.dataset.smcash === '1'; render(); }); });
  var bind = function (id, fn) { var e = $('#' + id); if (e) e.addEventListener('change', function () { fn(e.value); render(); }); };
  bind('f-bot', function (v) { state.tx.bot = v; state.txLimit = 100; }); bind('f-ex', function (v) { state.tx.ex = v; state.txLimit = 100; });
  bind('f-sym', function (v) { state.tx.sym = v; state.txLimit = 100; }); bind('f-side', function (v) { state.tx.side = v; state.txLimit = 100; });
  bind('p-sym', function (v) { state.sym = v; }); bind('t-sym', function (v) { state.sym = v; });
  var more = $('#more'); if (more) more.addEventListener('click', function () { state.txLimit += 200; render(); });
  panel.querySelectorAll('[data-hz]').forEach(function (b) { b.addEventListener('click', function () { state.hz = b.dataset.hz; render(); }); });
}
function render() {
  var panel = $('#panel');
  if (!D) { panel.innerHTML = emptyHtml(S); return; }
  Object.keys(REG).forEach(function (k) { delete REG[k]; });
  panel.innerHTML = buildPanels(D, S, state, width())[state.tab] || '';
  wire();
}
function setTab(t, push) {
  state.tab = t;
  document.querySelectorAll('#tabs button').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === t)); });
  if (push) { try { history.replaceState(null, '', '#' + t); } catch (e) { /* sin historial en el visor */ } }
  render();
}
/* Botones arriba para cambiar de simulador (mismo orden que el registro; el actual queda resaltado). Conservan la pestaña abierta. */
function navName(e) { var known = { binance: 'Actual', activo: 'Dinámico', indice: 'Indexado', ajustado: 'Ajustado V1' }; if (!e.name && known[e.dir]) return known[e.dir]; var n = (e.name || e.dir || '').replace(/^Simulador\s+/i, ''); return n ? n.charAt(0).toUpperCase() + n.slice(1) : e.dir; }
function simNavHtml(list, myId, myDir) {
  return '<span class="lbl">Simulador</span>' + list.map(function (e) {
    var cur = e.id === myId || e.dir === myDir;
    return '<a href="../' + esc(e.dir) + '/" data-dir="' + esc(e.dir) + '"' + (cur ? ' aria-current="page"' : '') + '>' + esc(navName(e)) + '</a>';
  }).join('');
}
function renderSimNav(list) {
  var nav = $('#sim-nav'); if (!nav || !Array.isArray(list) || list.length < 2) return;
  nav.innerHTML = simNavHtml(list, D && D.sim && D.sim.id, location.pathname.replace(/\/+$/, '').split('/').pop() || '');
  var cur = nav.querySelector('a[aria-current="page"]');
  if (cur && cur.scrollIntoView) { try { nav.scrollLeft = Math.max(0, cur.offsetLeft - 16); } catch (e) { /* sin scroll */ } }     // en móvil, deja a la vista el simulador actual
  nav.querySelectorAll('a').forEach(function (a) {
    a.addEventListener('click', function (ev) {
      if (a.getAttribute('aria-current') === 'page') { ev.preventDefault(); return; }
      if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button) return;          // abrir en pestaña nueva funciona normal
      ev.preventDefault(); location.href = '../' + a.dataset.dir + '/#' + state.tab;
    });
  });
}
/* Descubre los demás simuladores en el sitio publicado (carpetas hermanas) con el registro ../sims.json; si no existe, usa
   los conocidos y, en una copia suelta, data/other.json. Cada uno que responda se agrega a la comparación. */
function loadSims() {
  var get = function (u) { return fetch(u + (u.indexOf('?') < 0 ? '?t=' : '&t=') + Date.now()).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).catch(function () { return null; }); };
  var published = /github\.io$/.test(location.hostname);
  var reg = published ? get('../sims.json') : Promise.resolve(null);
  reg.then(function (list) {
    if (!Array.isArray(list) || !list.length) list = published ? ['binance', 'activo', 'indice'].map(function (k) { return { dir: k, id: k }; }) : [];
    var myId = D.sim && D.sim.id;
    list.forEach(function (e, i) { if (e.id === myId) state.selfOrder = i; });
    var others = list.filter(function (e) { return e.id !== myId && e.dir !== myId; });
    if (published) renderSimNav(list);
    var jobs = others.map(function (e, k) { return get('../' + e.dir + '/data/dashboard.json').then(function (x) { return x && x.kpis ? { d: x, order: list.indexOf(e) } : null; }); });
    if (!published) jobs.push(get('data/other.json').then(function (x) { return x && x.kpis ? { d: x, order: 99 } : null; }));
    Promise.all(jobs).then(function (res) {
      state.others = res.filter(Boolean).filter(function (o) { return !(o.d.sim && D.sim && o.d.sim.id === D.sim.id); });
      if (state.tab === 'comparar') render();
    });
  });
}
function load() {
  var get = function (u) { return fetch(u + '?t=' + Date.now()).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).catch(function () { return null; }); };
  Promise.all([get('data/dashboard.json'), get('data/status.json')]).then(function (res) {
    D = res[0]; S = res[1];
    $('#banners').innerHTML = bannersHtml(D, S);
    $('#sub').innerHTML = subHtml(D, S);
    if (D) {
      var st = $('#stamp'); st.textContent = D.synthetic ? 'Datos inventados · solo pruebas' : 'Simulación · dinero ficticio';
      var nm = D.sim && D.sim.name; if (nm) { $('#h1').textContent = nm + ' · bots cripto'; try { document.title = nm + ' · bots cripto'; } catch (e) { /* sin título */ } }
      loadSims();
    }
    render();
  });
}
document.querySelectorAll('#tabs button').forEach(function (b) { b.addEventListener('click', function () { setTab(b.dataset.tab, true); }); });
var rz; window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(render, 150); });
var h = (location.hash || '').replace('#', ''); if (/^(summary|resumen|pnl|tx|riesgo|tendencias|bots|comparar)$/.test(h)) state.tab = h;
setTab(state.tab, false);
load();
})();
</script>
